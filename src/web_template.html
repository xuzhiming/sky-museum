<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云巅博物馆 · Cyberpunk Sky Museum</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;font:13px system-ui,"Microsoft YaHei",sans-serif;color:#cfe}
  canvas{display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05060c;z-index:9;color:#7ef}
  #loading.hide{display:none}
  #ui{position:fixed;left:10px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100vw - 20px)}
  #ui button,#tp button{background:rgba(8,20,32,.78);color:#bfefff;border:1px solid #1fb6d8;border-radius:5px;padding:5px 9px;cursor:pointer;font:12px system-ui,"Microsoft YaHei"}
  #ui button.on{background:#0f6f88;color:#fff}
  #ui .lbl{align-self:center;color:#ffb866;margin:0 2px 0 6px}
  #tp{position:fixed;left:10px;top:84px;z-index:3;display:none;flex-wrap:wrap;gap:4px;max-width:calc(100vw - 20px)}
  #hud{position:fixed;left:10px;bottom:10px;z-index:3;background:rgba(5,12,20,.7);border:1px solid #1fb6d8;border-radius:6px;padding:6px 10px;display:none}
  #help{position:fixed;right:10px;bottom:10px;z-index:3;background:rgba(5,12,20,.8);border:1px solid #ffb866;border-radius:6px;padding:8px 12px;max-width:300px;display:none;line-height:1.6}
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#7ef;z-index:3;display:none}
  kbd{background:#123;border:1px solid #2a6;border-radius:3px;padding:0 4px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
}}
</script>
</head>
<body>
<div id="loading"><div id="msg">加载模型中 Loading model…</div><div id="err"></div></div>
<div id="cross"></div><div id="hud"></div>
<div id="help"><b>漫游模式 Walk</b><br><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · 鼠标/拖动 转向<br><kbd>Shift</kbd> 奔跑 · <kbd>Space</kbd> 跳跃<br><kbd>G</kbd> 飞行 (<kbd>E</kbd>/<kbd>Q</kbd> 升降)<br><kbd>1</kbd>-<kbd>9</kbd> 传送点 (电梯) · <kbd>F</kbd> 漫游/轨道 · <kbd>H</kbd> 帮助</div>
<div id="tp"></div>
<div id="ui">
  <button id="walkBtn">漫游模式 (F)</button>
  <button id="fxBloom" class="on">泛光 Bloom</button>
  <span class="lbl">视角</span>
  <button data-view="hero">Hero</button><button data-view="front">正立面</button><button data-view="right">侧立面</button><button data-view="top">顶视</button><button data-view="atrium">中庭</button>
  <span class="lbl">剖切</span>
  <button data-cut="999" class="on">全部</button><button data-cut="sec">剖面 A-A</button><button data-cut="60">≤L5</button><button data-cut="16">L1</button>
  <span class="lbl">显示</span>
  <button data-grp="shell" class="on">幕墙 Shell</button><button data-grp="int" class="on">室内 Interior</button>
</div>
<script id="glb" type="application/octet-stream">__GLB_BASE64__</script>
<script id="tpdata" type="application/json">__TP_JSON__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const $ = (id) => document.getElementById(id);
const TP = JSON.parse($('tpdata').textContent);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05060f); scene.fog = new THREE.FogExp2(0x070a18, 0.0006);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 6000);
camera.position.set(-560, -380 * -1, 640); // overwritten by goTo
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0, 180, 0);
scene.add(new THREE.HemisphereLight(0x6688cc, 0x101018, 0.9));
const sun = new THREE.DirectionalLight(0x8899ff, 0.6); sun.position.set(-300, 600, 400); scene.add(sun);
const amb = new THREE.PointLight(0xffaa55, 2.0, 120, 1.2); amb.position.set(0, 30, 0); scene.add(amb);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.45, 0.9); composer.addPass(bloom); composer.addPass(new OutputPass());
// Blender (x,y,z) -> three (x, z, -y)
const B = (x, y, z) => new THREE.Vector3(x, z, -y);
const VIEWS = { hero: [B(-520, -760, 140), B(0, 0, 180)], front: [B(0, -1150, 210), B(0, 0, 210)], right: [B(1150, 0, 210), B(0, 0, 210)],
  top: [B(0, -1, 1250), B(0, 0, 0)], atrium: [B(6, -42, 2), B(0, 0, 60)] };
let tween = null;
function goTo(v) { const [p, t] = VIEWS[v]; if (WALK.on) exitWalk(); tween = { p0: camera.position.clone(), p1: p, c0: controls.target.clone(), c1: t, t0: performance.now(), dur: 1200 }; }
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => goTo(b.dataset.view));
// groups
const byName = {}; const SHELL = ['Shell_Glass', 'Shell_Frame', 'Podium', 'Portal', 'Screens', 'Lights_Cyan', 'Obs_Decks', 'Spire', 'Entrance_Glass'];
document.querySelectorAll('[data-grp]').forEach(b => b.onclick = () => { b.classList.toggle('on'); const on = b.classList.contains('on');
  for (const n of TOP) { const isShell = SHELL.includes(n); if ((b.dataset.grp === 'shell') === isShell) byName[n].visible = on; } });
const TOP = [];
// cuts
const clipZ = new THREE.Plane(new THREE.Vector3(0, -1, 0), 999), clipY = new THREE.Plane(new THREE.Vector3(0, 0, -1), 9999);
function setCut(c) { document.querySelectorAll('[data-cut]').forEach(b => b.classList.toggle('on', b.dataset.cut === String(c)));
  if (c === 'sec') { clipZ.constant = 9999; clipY.constant = 0; } else { clipY.constant = 9999; clipZ.constant = +c; } }
document.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => setCut(b.dataset.cut));
$('fxBloom').onclick = () => { bloom.enabled = !bloom.enabled; $('fxBloom').classList.toggle('on', bloom.enabled); };
// ===== walk mode =====
const WALK = { on: false, fly: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), vy: 0, grounded: false, keys: new Set(), col: null, saved: null, first: true, jump: false, bvh: false, tris: 0, hits: 0, yaw: 0, pitch: 0 };
const EYE = 1.7, RAD = 0.35, STEP = 0.4, WALK_SPEED = 2.2, RUN_SPEED = 6.0;
camera.rotation.order = 'YXZ';
const rc = new THREE.Raycaster(); rc.firstHitOnly = true;
const V = { o: new THREE.Vector3(), down: new THREE.Vector3(0, -1, 0), up: new THREE.Vector3(0, 1, 0) };
function cast(o, d, far) { if (!WALK.col) return null; rc.set(o, d); rc.near = 0; rc.far = far; const h = rc.intersectObject(WALK.col, false); return h.length ? h[0] : null; }
const COLL = __COLL_JSON__;
async function buildCollision(root) {
  root.updateMatrixWorld(true); const arrs = []; let n = 0; const v = new THREE.Vector3();
  for (const name of COLL) { const node = byName[name]; if (!node) continue;
    node.traverse(o => { if (!o.isMesh) return; const g = o.geometry, pa = g.attributes.position, idx = g.index, m = o.matrixWorld;
      const cnt = idx ? idx.count : pa.count, out = new Float32Array(cnt * 3);
      for (let i = 0; i < cnt; i++) { const k = idx ? idx.getX(i) : i; v.fromBufferAttribute(pa, k).applyMatrix4(m); out[i * 3] = v.x; out[i * 3 + 1] = v.y; out[i * 3 + 2] = v.z; }
      arrs.push(out); n += cnt / 3; }); }
  let tot = 0; for (const a of arrs) tot += a.length; const all = new Float32Array(tot); let off = 0; for (const a of arrs) { all.set(a, off); off += a.length; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(all, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  try { const M = await import('three-mesh-bvh'); geo.computeBoundsTree = M.computeBoundsTree; geo.computeBoundsTree(); mesh.raycast = M.acceleratedRaycast; WALK.bvh = true; }
  catch (e) { console.warn('three-mesh-bvh unavailable, brute-force raycast', e); }
  WALK.col = mesh; WALK.tris = n;
}
function setLook(yaw, pitch) { WALK.yaw = yaw; WALK.pitch = pitch; camera.rotation.set(pitch, yaw, 0, 'YXZ'); }
function floorName(y) { let best = 'L1'; for (const f of TP.floors) if (y >= f[1] - 1) best = f[0]; return best; }
function teleport(name) { const s = TP.spawn[name]; if (!s) return; WALK.pos.set(s[0], s[2] + 0.05, -s[1]); WALK.vel.set(0, 0, 0); WALK.vy = 0; WALK.grounded = false; setLook(s[3], 0); syncCam(); }
function syncCam() { camera.position.set(WALK.pos.x, WALK.pos.y + EYE, WALK.pos.z); }
const DIRS = []; for (let k = 0; k < 8; k++) DIRS.push(new THREE.Vector3(Math.cos(k * Math.PI / 4), 0, Math.sin(k * Math.PI / 4)));
const HEIGHTS = [0.45, 0.95, 1.45];
function pushOut() { for (let it = 0; it < 2; it++) { let moved = false;
  for (const d of DIRS) for (const h of HEIGHTS) { V.o.set(WALK.pos.x, WALK.pos.y + h, WALK.pos.z); const hit = cast(V.o, d, RAD);
    if (hit) { const pen = RAD - hit.distance; WALK.pos.x -= d.x * pen; WALK.pos.z -= d.z * pen; moved = true; WALK.hits++; } }
  if (!moved) break; } }
function walkStep(dt) {
  const k = WALK.keys, P = WALK.pos, fly = WALK.fly;
  const fwd = (k.has('KeyW') || k.has('ArrowUp') ? 1 : 0) - (k.has('KeyS') || k.has('ArrowDown') ? 1 : 0);
  const str = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0);
  const sn = Math.sin(WALK.yaw), cs = Math.cos(WALK.yaw);
  let wx = -sn * fwd + cs * str, wz = -cs * fwd - sn * str; const wl = Math.hypot(wx, wz); if (wl > 0) { wx /= wl; wz /= wl; }
  const speed = ((k.has('ShiftLeft') || k.has('ShiftRight')) ? RUN_SPEED : WALK_SPEED) * (fly ? 4 : 1);
  const a = 1 - Math.exp(-((WALK.grounded || fly) ? 10 : 2.5) * dt);
  WALK.vel.x += (wx * speed - WALK.vel.x) * a; WALK.vel.z += (wz * speed - WALK.vel.z) * a;
  P.x += WALK.vel.x * dt; P.z += WALK.vel.z * dt;
  if (fly) { const up = (k.has('Space') || k.has('KeyE') ? 1 : 0) - (k.has('KeyC') || k.has('KeyQ') ? 1 : 0);
    WALK.vy += (up * speed - WALK.vy) * (1 - Math.exp(-8 * dt)); P.y += WALK.vy * dt; WALK.grounded = false; }
  else {
    if (WALK.jump && WALK.grounded) { WALK.vy = 4.2; WALK.grounded = false; } WALK.jump = false;
    if (!WALK.grounded) WALK.vy -= 9.8 * dt;
    if (!WALK.grounded || WALK.vy > 0) P.y += WALK.vy * dt;
    if (WALK.vy > 0) { V.o.set(P.x, P.y + 1.0, P.z); const h = cast(V.o, V.up, 0.85); if (h) { P.y = Math.min(P.y, h.point.y - 1.85); WALK.vy = 0; } }
    if (WALK.vy <= 0) { V.o.set(P.x, P.y + STEP, P.z);
      const far = STEP + (WALK.grounded ? 0.45 : 0) + (WALK.vy < 0 ? -WALK.vy * dt : 0) + 0.02; const hit = cast(V.o, V.down, far);
      if (hit && Math.abs(hit.face.normal.y) > 0.75) { const gy = V.o.y - hit.distance; if (WALK.grounded || gy >= P.y - 0.02) { P.y = gy; WALK.vy = 0; WALK.grounded = true; } }
      else WALK.grounded = false; }
  }
  pushOut();
  if (P.y < -30) teleport('plaza');
}
function updateWalk(dtR) { let dt = Math.min(dtR, 0.3); while (dt > 1e-6) { const s = Math.min(dt, 1 / 60); walkStep(s); dt -= s; } syncCam();
  const p = WALK.pos; $('hud').innerHTML = `楼层 <b>${floorName(p.y)}</b> · X ${p.x.toFixed(1)} Y ${(-p.z).toFixed(1)} 高度 ${p.y.toFixed(2)} m · ${WALK.fly ? '飞行' : (WALK.grounded ? '步行' : '空中')}`; }
function enterWalk() { if (WALK.on) return; WALK.saved = { p: camera.position.clone(), t: controls.target.clone() }; tween = null; controls.enabled = false; WALK.on = true;
  camera.fov = 72; camera.near = 0.08; camera.updateProjectionMatrix(); if (WALK.first) { teleport('plaza'); WALK.first = false; } else syncCam();
  for (const id of ['cross', 'hud', 'help']) $(id).style.display = 'block'; $('tp').style.display = 'flex'; $('walkBtn').classList.add('on'); }
function exitWalk() { if (!WALK.on) return; WALK.on = false; WALK.keys.clear(); camera.fov = 40; camera.near = 0.5; camera.updateProjectionMatrix();
  camera.position.copy(WALK.saved.p); controls.target.copy(WALK.saved.t); controls.enabled = true; for (const id of ['cross', 'hud', 'help', 'tp']) $(id).style.display = 'none'; $('walkBtn').classList.remove('on'); }
$('walkBtn').onclick = () => (WALK.on ? exitWalk() : enterWalk());
TP.order.forEach((n, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + TP.label[n]; b.onclick = () => teleport(n); $('tp').appendChild(b); });
addEventListener('keydown', (e) => { if (e.code === 'KeyF') { WALK.on ? exitWalk() : enterWalk(); return; }
  if (!WALK.on) return; WALK.keys.add(e.code);
  if (e.code === 'Space' && !WALK.fly) WALK.jump = true; if (e.code === 'KeyG') WALK.fly = !WALK.fly; if (e.code === 'KeyH') $('help').style.display = $('help').style.display === 'none' ? 'block' : 'none';
  const d = e.code.match(/^Digit(\d)$/); if (d) { const n = TP.order[+d[1] - 1]; if (n) teleport(n); } });
addEventListener('keyup', (e) => WALK.keys.delete(e.code));
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { if (WALK.on) drag = { x: e.clientX, y: e.clientY, yaw: WALK.yaw, pitch: WALK.pitch }; });
addEventListener('pointermove', (e) => { if (!drag) return; setLook(drag.yaw - (e.clientX - drag.x) * 0.005, Math.max(-1.4, Math.min(1.4, drag.pitch - (e.clientY - drag.y) * 0.005))); });
addEventListener('pointerup', () => { drag = null; });
window.__walk = { enter: enterWalk, exit: exitWalk, teleport, setLook, state: () => ({ on: WALK.on, fly: WALK.fly, grounded: WALK.grounded, x: WALK.pos.x, y: -WALK.pos.z, z: WALK.pos.y, yaw: WALK.yaw, floor: floorName(WALK.pos.y), bvh: WALK.bvh, tris: WALK.tris, hits: WALK.hits, ready: !!WALK.col }),
  setPos: (x, y, z) => { WALK.pos.set(x, z + 0.05, -y); WALK.vel.set(0, 0, 0); WALK.vy = 0; WALK.grounded = false; syncCam(); } };
// ===== load =====
function b64ToBuffer(b64) { const bin = atob(b64.replace(/\s+/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
try {
  const buf = b64ToBuffer($('glb').textContent); $('glb').remove();
  loader.parse(buf, '', (gltf) => {
    gltf.scene.traverse(o => { if (o.name && !byName[o.name]) byName[o.name] = o;
      if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; for (const m of ms) { m.clippingPlanes = [clipZ, clipY]; if (m.transparent) { m.depthWrite = false; } if (m.emissiveIntensity > 1) m.emissiveIntensity = Math.min(2.2, 0.5 + m.emissiveIntensity * 0.14); } } });
    gltf.scene.children.forEach(c => TOP.push(c.name)); scene.add(gltf.scene); $('loading').classList.add('hide'); window.__ready = true;
    buildCollision(gltf.scene).then(() => { window.__collisionReady = true; });
    goTo('hero'); tween.dur = 1;
  }, (e) => { $('msg').textContent = 'Failed to load model'; $('err').textContent = String(e && e.message || e); console.error(e); });
} catch (e) { $('msg').textContent = 'Failed to load model'; $('err').textContent = String(e); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let lastT = performance.now();
renderer.setAnimationLoop(() => { const now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
  if (WALK.on && WALK.col) updateWalk(dt);
  if (tween) { const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k); camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.c0, tween.c1, e); if (k >= 1) tween = null; }
  if (!WALK.on) controls.update(); composer.render(); });
window.__goTo = goTo; window.__setCut = setCut;
</script>
</body>
